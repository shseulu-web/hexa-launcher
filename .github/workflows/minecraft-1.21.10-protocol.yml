name: Minecraft 1.21.10 protocol compatibility

on:
  push:
    branches: [hexa-launcher-dev]
    paths:
      - "crates/horizon-protocol/**"
      - "crates/horizon-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/ci/rust-version"
      - ".github/workflows/minecraft-1.21.10-protocol.yml"
  pull_request:
    paths:
      - "crates/horizon-protocol/**"
      - "crates/horizon-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/ci/rust-version"
      - ".github/workflows/minecraft-1.21.10-protocol.yml"

permissions:
  contents: read

jobs:
  protocol-tests:
    name: 1.21.10 protocol adapter regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: bash tools/ci/rustup_install.sh --profile minimal
      - name: Run protocol and version-adapter tests
        run: cargo test --locked -p horizon-protocol
